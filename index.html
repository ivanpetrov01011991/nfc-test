<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f1e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Домашняя кухня">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <title>Меню — Домашняя кухня</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #30271f;
        background: #f6f1e8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      }

      main {
        width: min(100%, 440px);
        padding: 32px 24px;
        border: 1px solid #eadfce;
        border-radius: 24px;
        background: #fffdf9;
        box-shadow: 0 12px 36px #4b382012;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #9b583f;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .14em;
        text-align: center;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(34px, 10vw, 46px);
        font-weight: 500;
        text-align: center;
      }

      .intro {
        margin: 10px 0 26px;
        color: #766b5e;
        font-size: 15px;
        text-align: center;
      }

      .dish {
        display: grid;
        grid-template-columns: 48px 1fr;
        gap: 14px;
        align-items: center;
        padding: 17px 0;
        border-top: 1px solid #eee5d8;
      }

      .icon {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border-radius: 16px;
        background: #f7eee3;
        font-size: 25px;
      }

      h2 {
        margin: 0 0 4px;
        font-size: 17px;
      }

      .description {
        margin: 0;
        color: #766b5e;
        font-size: 13px;
        line-height: 1.45;
      }

      footer {
        margin-top: 8px;
        color: #9b583f;
        font-size: 13px;
        font-weight: 600;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Домашняя кухня</p>
      <h1>Наше меню</h1>
      <p class="intro">Просто, сытно и с душой</p>

      <section aria-label="Блюда меню">
        <article class="dish">
          <span class="icon" aria-hidden="true">🍲</span>
          <div>
            <h2>Борщ</h2>
            <p class="description">Наваристый, со сметаной и свежей зеленью</p>
          </div>
        </article>

        <article class="dish">
          <span class="icon" aria-hidden="true">🥟</span>
          <div>
            <h2>Пельмени</h2>
            <p class="description">Сочные, с домашней начинкой</p>
          </div>
        </article>

        <article class="dish">
          <span class="icon" aria-hidden="true">🍹</span>
          <div>
            <h2>Компот</h2>
            <p class="description">Домашний, из сезонных фруктов</p>
          </div>
        </article>
      </section>

      <footer>Приятного аппетита!</footer>
    </main>
    <script>
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
      }
    </script>
  </body>
</html>
